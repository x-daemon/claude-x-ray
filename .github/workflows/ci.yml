name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build app bundle
        run: ./scripts/build-app.sh

      - name: Zip app
        run: ditto -c -k --keepParent "build/S2A Claude X-Ray.app" "build/S2A-Claude-X-Ray.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: S2A-Claude-X-Ray
          path: build/S2A-Claude-X-Ray.zip
          retention-days: 14

  cloud-hook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Test the cloud push hook
        run: python3 cloud/test_xray_push.py

      - name: Setup script matches the hook
        run: |
          python3 scripts/make-setup-script.py
          git diff --exit-code cloud/setup-environment.sh
