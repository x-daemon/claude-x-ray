name: Release

# Builds the universal app, runs the tests, packages DMG + ZIP, publishes a GitHub
# release and mirrors the files to the `dist` branch. Run it manually or push a v* tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 0.3.0
        required: true
        default: "0.3.0"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then V="$INPUT_VERSION"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/package.sh

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release delete "v$VERSION" --yes --cleanup-tag
          fi
          gh release create "v$VERSION" dist/* \
            --title "S2A Claude X-Ray $VERSION" \
            --notes-file RELEASE_NOTES.md \
            --target "$GITHUB_SHA"

      - name: Mirror to the dist branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "S2A Claude X-Ray $VERSION (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist
