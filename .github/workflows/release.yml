name: Release

# Builds the universal macOS app (DMG + ZIP) and the Windows app (installers + ZIPs), runs the
# tests, publishes a GitHub release and mirrors the files to the `dist` branch (files under
# 95 MB). Run it manually or push a v* tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 0.8.0
        required: true
        default: "0.8.0"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    # Windows installers (NSIS) and portable ZIPs for x64 and ARM64, built on Windows.
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then V="$INPUT_VERSION"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Install, check and test
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm run build
          npx electron-builder --win nsis zip --x64 --publish never
          npx electron-builder --win nsis zip --arm64 --publish never
          mkdir -p out
          cp release/*.exe release/*.zip out/
          # Same x64 installer without the version, so releases/latest/download/S2A-Claude-X-Ray-Setup.exe always works.
          cp "release/S2A-Claude-X-Ray-Setup-$VERSION-x64.exe" out/S2A-Claude-X-Ray-Setup.exe
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: windows/out/*
          retention-days: 7

  release:
    needs: windows
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then V="$INPUT_VERSION"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/package.sh

      - name: Windows files
        uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: dist

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 ./*.dmg ./*.zip ./*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release delete "v$VERSION" --yes --cleanup-tag
          fi
          gh release create "v$VERSION" dist/* \
            --title "S2A Claude X-Ray $VERSION" \
            --notes-file RELEASE_NOTES.md \
            --target "$GITHUB_SHA"

      - name: Mirror to the dist branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist
          # Git refuses files over 100 MB; the large Windows files stay on the release page only.
          find . -type f -size +95M -print -delete
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "S2A Claude X-Ray $VERSION (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist
