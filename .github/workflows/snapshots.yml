name: Snapshots

# Builds the app, generates demo transcripts, captures every screen in light and dark
# appearance and publishes the PNGs to the `snapshots` branch. Run it manually.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshots:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build --product S2AClaudeXRay

      - name: Demo data
        run: python3 scripts/demo-data.py "$RUNNER_TEMP/xray-demo"

      - name: Status line command
        # Feeds Claude Code's status line JSON to the app binary the way Claude Code does;
        # it prints the status line and saves the account's plan usage for the app.
        run: |
          BIN="$(swift build --product S2AClaudeXRay --show-bin-path)/S2AClaudeXRay"
          NOW=$(date +%s)
          printf '{"session_id":"demo","model":{"id":"claude-opus-5-5","display_name":"Opus 5.5"},"version":"2.1.325","context_window":{"used_percentage":42},"rate_limits":{"five_hour":{"used_percentage":37.5,"resets_at":%d},"seven_day":{"used_percentage":22,"resets_at":%d}}}' $((NOW + 7800)) $((NOW + 3 * 86400 + 5000)) > "$RUNNER_TEMP/statusline.json"
          "$BIN" --statusline < "$RUNNER_TEMP/statusline.json" | tee "$RUNNER_TEMP/statusline.txt"
          grep -q "5 ч 38%" "$RUNNER_TEMP/statusline.txt"
          cat "$HOME/Library/Application Support/S2AClaudeXRay/plan-usage.json"

      - name: Capture screens
        run: |
          set +e
          OUT="$RUNNER_TEMP/snapshots"
          mkdir -p "$OUT/screen"
          BIN="$(swift build --product S2AClaudeXRay --show-bin-path)/S2AClaudeXRay"
          CLAUDE_CONFIG_DIR="$RUNNER_TEMP/xray-demo" XRAY_SNAPSHOT_DIR="$OUT" "$BIN" > "$OUT/app-output.txt" 2>&1 &
          APP=$!
          for i in 1 2 3 4 5 6; do
            sleep 8
            screencapture -x -t jpg "$OUT/screen/screen-$i.jpg" 2>> "$OUT/screen/errors.txt"
            kill -0 $APP 2>/dev/null || break
          done
          for i in $(seq 1 90); do
            kill -0 $APP 2>/dev/null || break
            sleep 2
          done
          kill $APP 2>/dev/null
          wait $APP
          echo "exit code: $?" >> "$OUT/app-output.txt"
          cp ~/Library/Logs/DiagnosticReports/S2AClaudeXRay* "$OUT/" 2>/dev/null
          ls -la "$OUT" "$OUT/screen"
          cat "$OUT/snapshots.log" "$OUT/app-output.txt" 2>/dev/null
          exit 0

      - name: Capture empty states
        run: |
          set +e
          BIN="$(swift build --product S2AClaudeXRay --show-bin-path)/S2AClaudeXRay"
          capture() {
            out="$RUNNER_TEMP/snapshots/$1"
            mkdir -p "$out"
            CLAUDE_CONFIG_DIR="$2" XRAY_SNAPSHOT_DIR="$out" XRAY_SNAPSHOT_SCREENS=live,trace "$BIN" > "$out/app-output.txt" 2>&1 &
            app=$!
            for i in $(seq 1 60); do
              kill -0 $app 2>/dev/null || break
              sleep 2
            done
            kill $app 2>/dev/null
            wait $app
            ls -la "$out"
            cat "$out/snapshots.log" 2>/dev/null
          }
          # Claude Code last ran 4 days ago, then no transcripts at all.
          python3 scripts/demo-data.py "$RUNNER_TEMP/xray-stale" --ago 4
          capture stale "$RUNNER_TEMP/xray-stale"
          capture empty "$RUNNER_TEMP/xray-none"
          exit 0

      - name: Publish to the snapshots branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/snapshots"
          git init -q -b snapshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Snapshots of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" snapshots
