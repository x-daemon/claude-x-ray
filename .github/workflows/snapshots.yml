name: Snapshots

# Builds the app, generates demo transcripts, captures every screen in light and dark
# appearance and publishes the PNGs to the `snapshots` branch. Run it manually.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshots:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build --product S2AClaudeXRay

      - name: Demo data
        run: python3 scripts/demo-data.py "$RUNNER_TEMP/xray-demo"

      - name: Status line command
        # Feeds Claude Code's status line JSON to the app binary the way Claude Code does;
        # it prints the status line and saves the account's plan usage for the app.
        run: |
          BIN="$(swift build --product S2AClaudeXRay --show-bin-path)/S2AClaudeXRay"
          NOW=$(date +%s)
          printf '{"session_id":"demo","model":{"id":"claude-opus-5-5","display_name":"Opus 5.5"},"version":"2.1.325","context_window":{"used_percentage":42},"rate_limits":{"five_hour":{"used_percentage":37.5,"resets_at":%d},"seven_day":{"used_percentage":22,"resets_at":%d}}}' $((NOW + 7800)) $((NOW + 3 * 86400 + 5000)) > "$RUNNER_TEMP/statusline.json"
          XRAY_SNAPSHOT_LANGUAGE=ru "$BIN" --statusline < "$RUNNER_TEMP/statusline.json" | tee "$RUNNER_TEMP/statusline.txt"
          grep -q "5 ч 38%" "$RUNNER_TEMP/statusline.txt"
          XRAY_SNAPSHOT_LANGUAGE=de "$BIN" --statusline < "$RUNNER_TEMP/statusline.json" | tee "$RUNNER_TEMP/statusline-de.txt"
          grep -q "5 Std. 38%" "$RUNNER_TEMP/statusline-de.txt"
          cat "$HOME/Library/Application Support/S2AClaudeXRay/plan-usage.json"

      - name: Capture screens
        run: |
          set +e
          OUT="$RUNNER_TEMP/snapshots"
          mkdir -p "$OUT/screen"
          BIN="$(swift build --product S2AClaudeXRay --show-bin-path)/S2AClaudeXRay"
          CLAUDE_CONFIG_DIR="$RUNNER_TEMP/xray-demo" XRAY_SNAPSHOT_DIR="$OUT" XRAY_SNAPSHOT_LANGUAGE=ru "$BIN" > "$OUT/app-output.txt" 2>&1 &
          APP=$!
          for i in 1 2 3 4 5 6; do
            sleep 8
            screencapture -x -t jpg "$OUT/screen/screen-$i.jpg" 2>> "$OUT/screen/errors.txt"
            kill -0 $APP 2>/dev/null || break
          done
          for i in $(seq 1 90); do
            kill -0 $APP 2>/dev/null || break
            sleep 2
          done
          kill $APP 2>/dev/null
          wait $APP
          echo "exit code: $?" >> "$OUT/app-output.txt"
          cp ~/Library/Logs/DiagnosticReports/S2AClaudeXRay* "$OUT/" 2>/dev/null
          ls -la "$OUT" "$OUT/screen"
          cat "$OUT/snapshots.log" "$OUT/app-output.txt" 2>/dev/null
          exit 0

      - name: Capture empty states
        run: |
          set +e
          BIN="$(swift build --product S2AClaudeXRay --show-bin-path)/S2AClaudeXRay"
          capture() {
            out="$RUNNER_TEMP/snapshots/$1"
            mkdir -p "$out"
            CLAUDE_CONFIG_DIR="$2" XRAY_SNAPSHOT_DIR="$out" XRAY_SNAPSHOT_LANGUAGE=ru XRAY_SNAPSHOT_SCREENS=live,trace "$BIN" > "$out/app-output.txt" 2>&1 &
            app=$!
            for i in $(seq 1 60); do
              kill -0 $app 2>/dev/null || break
              sleep 2
            done
            kill $app 2>/dev/null
            wait $app
            ls -la "$out"
            cat "$out/snapshots.log" 2>/dev/null
          }
          # Claude Code last ran 4 days ago, then no transcripts at all.
          python3 scripts/demo-data.py "$RUNNER_TEMP/xray-stale" --ago 4
          capture stale "$RUNNER_TEMP/xray-stale"
          capture empty "$RUNNER_TEMP/xray-none"
          exit 0

      - name: Capture in English and German
        run: |
          set +e
          BIN="$(swift build --product S2AClaudeXRay --show-bin-path)/S2AClaudeXRay"
          for CODE in en de; do
            OUT="$RUNNER_TEMP/snapshots/$CODE"
            mkdir -p "$OUT"
            CLAUDE_CONFIG_DIR="$RUNNER_TEMP/xray-demo" XRAY_SNAPSHOT_DIR="$OUT" XRAY_SNAPSHOT_LANGUAGE=$CODE \
              XRAY_SNAPSHOT_SCREENS=live,trace,overview,sessions,insights,reports "$BIN" > "$OUT/app-output.txt" 2>&1 &
            APP=$!
            for i in $(seq 1 120); do
              kill -0 $APP 2>/dev/null || break
              sleep 2
            done
            kill $APP 2>/dev/null
            wait $APP
            ls -la "$OUT"
            cat "$OUT/snapshots.log" 2>/dev/null
          done
          exit 0

      - name: Cloud receiver
        # Starts the app with the receiver on, pushes a demo transcript through the real hook
        # script, checks the token is enforced and captures the screens that show it.
        run: |
          set +e
          BIN="$(swift build --product S2AClaudeXRay --show-bin-path)/S2AClaudeXRay"
          OUT="$RUNNER_TEMP/snapshots/cloud"
          mkdir -p "$OUT" "$RUNNER_TEMP/xray-nolocal"
          CLAUDE_CONFIG_DIR="$RUNNER_TEMP/xray-nolocal" XRAY_RECEIVER_PORT=47318 XRAY_RECEIVER_TOKEN=ci-token \
            XRAY_SNAPSHOT_DIR="$OUT" XRAY_SNAPSHOT_LANGUAGE=ru XRAY_SNAPSHOT_SCREENS=live,trace,sessions XRAY_SNAPSHOT_DELAY=12 \
            "$BIN" > "$OUT/app-output.txt" 2>&1 &
          APP=$!
          for i in $(seq 1 30); do curl -s http://127.0.0.1:47318/health && break; sleep 1; done
          echo
          LIVE=$(ls -t "$RUNNER_TEMP"/xray-demo/projects/*/*.jsonl | head -1)
          echo "wrong token: $(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Authorization: Bearer nope' \
            -H 'X-Path: -demo/x.jsonl' --data-binary @"$LIVE" http://127.0.0.1:47318/v1/transcript)"
          # The cloud proxy adds the token header; here curl's config file stands in for it.
          printf 'header = "Authorization: Bearer ci-token"\n' > "$RUNNER_TEMP/.curlrc"
          mkdir -p "$RUNNER_TEMP/cloud-home/.claude/projects/-home-user-demo"
          cp "$LIVE" "$RUNNER_TEMP/cloud-home/.claude/projects/-home-user-demo/cloud-session.jsonl"
          echo '{"session_id":"cloud-session","transcript_path":"'"$RUNNER_TEMP"'/cloud-home/.claude/projects/-home-user-demo/cloud-session.jsonl"}' \
            | CURL_HOME="$RUNNER_TEMP" XRAY_PUSH_URL=http://127.0.0.1:47318/v1/transcript python3 cloud/xray-push.py
          sleep 4
          ls -laR "$HOME/Library/Application Support/S2AClaudeXRay/cloud"
          cmp "$RUNNER_TEMP/cloud-home/.claude/projects/-home-user-demo/cloud-session.jsonl" \
            "$HOME/Library/Application Support/S2AClaudeXRay/cloud/-home-user-demo/cloud-session.jsonl" && echo "received copy is identical"
          for i in $(seq 1 60); do kill -0 $APP 2>/dev/null || break; sleep 2; done
          kill $APP 2>/dev/null
          cat "$OUT/snapshots.log"
          exit 0

      - name: Publish to the snapshots branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/snapshots"
          git init -q -b snapshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Snapshots of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" snapshots
